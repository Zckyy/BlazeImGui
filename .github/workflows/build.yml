name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DX11 (demo + library)
            dx11: ON
          - name: Renderer-agnostic (BLAZE_RENDERER_DX11=OFF)
            dx11: OFF
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBLAZE_RENDERER_DX11=${{ matrix.dx11 }} -DBLAZE_WARNINGS_AS_ERRORS=ON
      - name: Build (Release)
        run: cmake --build build --config Release --parallel
      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel
